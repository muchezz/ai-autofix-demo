version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n']
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_EDITOR_BASE_URL=https://${N8N_HOST}/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - GENERIC_TIMEZONE=Africa/Nairobi
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # --- consumed by the Code node ("brain") ---
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL}
      - GH_TOKEN=${GH_TOKEN}
      - AUTOFIX_WEBHOOK_SECRET=${AUTOFIX_WEBHOOK_SECRET}
      # --- used by the email node expressions ---
      - AUTOFIX_FROM_EMAIL=${AUTOFIX_FROM_EMAIL}
      - AUTOFIX_TO_EMAIL=${AUTOFIX_TO_EMAIL}
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - '5678'

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      - N8N_HOST=${N8N_HOST}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  n8n_data:
  caddy_data:
  caddy_config:
